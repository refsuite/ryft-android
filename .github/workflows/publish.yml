name: publish

on:
  release:
    types: [released]
  workflow_dispatch: {}

# Publishes the static Maven repo to the `maven` branch (served anonymously over
# raw.githubusercontent.com). Uses the built-in GITHUB_TOKEN — no stored secrets.
jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    - name: Check out the maven branch into a worktree
      run: |
        git fetch origin maven
        git worktree add ../ryft-android-maven origin/maven

    - name: Publish into the worktree
      run: ./gradlew publishReleasePublicationToRawMavenRepository --max-workers 1 -PrawMavenDir="$GITHUB_WORKSPACE/../ryft-android-maven"

    - name: Commit and push the maven branch
      working-directory: ../ryft-android-maven
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add -A
        git commit -m "publish ${{ github.event.release.tag_name || github.sha }}" || { echo "nothing to publish"; exit 0; }
        git push origin HEAD:maven
