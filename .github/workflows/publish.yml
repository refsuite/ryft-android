name: publish

# FORK: publishes the refsuite fork to GitHub Packages on a version tag (e.g. v2.0.1-refsuite.1),
# using the built-in GITHUB_TOKEN (packages:write). Replaces upstream's Maven Central / Sonatype flow.
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Publish to GitHub Packages
        run: ./gradlew publish --max-workers 1
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
