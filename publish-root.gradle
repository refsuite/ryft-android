// The Refsuite fork publishes a static Maven repository to the `maven` orphan
// branch of this repo, served anonymously over raw.githubusercontent.com (so
// consuming apps need NO credentials). Publishing writes artifacts into a
// checkout of that branch; point `rawMavenDir` at it. Create the worktree once:
//   git worktree add ../ryft-android-maven maven
// The actual Maven repository is declared per-module in publish-module.gradle.
ext["rawMavenDir"] = (project.findProperty("rawMavenDir")
    ?: "${rootDir}/../ryft-android-maven").toString()
