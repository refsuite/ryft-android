apply plugin: "maven-publish"
// FORK: dropped `apply plugin: 'signing'` — GitHub Packages does not require GPG-signed artifacts.

afterEvaluate { project ->
    publishing {
        // FORK: publish to the refsuite GitHub Packages Maven registry instead of Sonatype.
        // Credentials come from gradle.properties (gpr.user/gpr.key) or env (GITHUB_ACTOR/GITHUB_TOKEN).
        repositories {
            maven {
                name = "GitHubPackages"
                url = uri("https://maven.pkg.github.com/refsuite/ryft-android")
                credentials {
                    username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR")
                    password = project.findProperty("gpr.key") ?: System.getenv("GITHUB_TOKEN")
                }
            }
        }
        publications {
            release(MavenPublication) {
                groupId rootProject.ext.group
                artifactId project.artifactId
                version rootProject.ext.version

                if (project.plugins.findPlugin("com.android.library")) {
                    from components.release
                } else {
                    from components.java
                }

                pom {
                    name = project.artifactName
                    description = project.artifactDescrption
                    url = "https://github.com/RyftPay/ryft-android"

                    licenses {
                        license {
                            name = "The MIT License"
                            url = "https://raw.githubusercontent.com/RyftPay/ryft-android/master/LICENSE"
                            distribution = "repo"
                        }
                    }

                    developers {
                        developer {
                            id = "ryftpay"
                            name = "Ryft"
                        }
                    }

                    scm {
                        connection = 'scm:git:github.com/RyftPay/ryft-android.git'
                        developerConnection = 'scm:git:ssh://github.com/RyftPay/ryft-android.git'
                        url = 'https://github.com/RyftPay/ryft-android/tree/master'
                    }
                }
            }
        }
    }
}

// FORK: removed the `signing { … }` block (no GPG signing for GitHub Packages).

task cleanBuildPublishLocal(type: GradleBuild) {
    tasks = ['clean', 'build', 'publishToMavenLocal']
}