apply plugin: "maven-publish"

afterEvaluate { project ->
    publishing {
        publications {
            release(MavenPublication) {
                groupId rootProject.ext.group
                artifactId project.artifactId
                version rootProject.ext.version

                if (project.plugins.findPlugin("com.android.library")) {
                    from components.release
                } else {
                    from components.java
                }

                pom {
                    name = project.artifactName
                    description = project.artifactDescrption
                    url = "https://github.com/refsuite/ryft-android"

                    licenses {
                        license {
                            name = "The MIT License"
                            url = "https://raw.githubusercontent.com/refsuite/ryft-android/main/LICENSE"
                            distribution = "repo"
                        }
                    }

                    developers {
                        developer {
                            id = "refsuite"
                            name = "Refsuite"
                        }
                    }

                    scm {
                        connection = 'scm:git:github.com/refsuite/ryft-android.git'
                        developerConnection = 'scm:git:ssh://github.com/refsuite/ryft-android.git'
                        url = 'https://github.com/refsuite/ryft-android/tree/main'
                    }
                }
            }
        }
        repositories {
            // Publishes into a local checkout of the `maven` branch (no
            // credentials). Commit + push that branch to make the new version
            // available over raw.githubusercontent.com. See DEVELOPMENT.md.
            maven {
                name = "RawMaven"
                url = rootProject.file(rootProject.ext.rawMavenDir).toURI()
            }
        }
    }
}

// Publish all modules to the local Maven cache (~/.m2) for ad-hoc testing:
//   ./gradlew cleanBuildPublishLocal
task cleanBuildPublishLocal(type: GradleBuild) {
    tasks = ['clean', 'build', 'publishToMavenLocal']
}
