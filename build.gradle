// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext.kotlin_version = '2.1.21'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

plugins {
    id("org.jlleitschuh.gradle.ktlint") version "11.6.1" apply false
    // FORK: dropped io.github.gradle-nexus.publish-plugin — we publish to GitHub Packages, not Sonatype.
}

ext {
    // FORK: distinct group/version so this never collides with upstream com.ryftpay:*:2.0.1.
    version = '2.0.1-refsuite.1'
    group = "com.refsuite.ryft"
    java_version = JavaVersion.VERSION_17
    kotlin_jvm_target = '17'
    min_sdk_version = 24
    compile_sdk_version = 36
    target_sdk_version = 36
    build_tools_version = '36.0.0'
}

allprojects {
    repositories {
        // For local development
        mavenLocal()
        google()
        mavenCentral()
        maven { url 'https://maven.ravelin.com/public/repositories/threeds2service/' }
    }
}

subprojects {
    apply plugin: "org.jlleitschuh.gradle.ktlint"

    ktlint {
        reporters {
            reporter "html"
        }
    }
}

tasks.register('clean', Delete) {
    delete rootProject.buildDir
}

// FORK: removed `apply from: "publish-root.gradle"` (Sonatype/nexus + GPG). GitHub Packages
// repository + credentials are configured per-module in publish-module.gradle.